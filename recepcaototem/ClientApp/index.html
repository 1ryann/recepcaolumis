<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Must appear before the inline FOUC script below (not after, as it used to): the script
         updates this tag's `content` synchronously so browser chrome (the mobile status bar /
         task-switcher color) matches the theme from first paint, with no flash of the wrong
         color. That only works if the element already exists in the DOM when the script runs —
         moving the tag up (rather than, say, deferring the update to DOMContentLoaded) keeps the
         whole theme decision synchronous and in one place. -->
    <meta name="theme-color" content="#f2f2f2" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('lumis-theme');
          var theme = (stored === 'light' || stored === 'dark')
            ? stored
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          var themeColorMeta = document.querySelector('meta[name="theme-color"]');
          if (themeColorMeta) {
            // Mirrors --lumis-bg's light (#f2f2f2) and dark (#181818) values in styles.css.
            themeColorMeta.setAttribute('content', theme === 'dark' ? '#181818' : '#f2f2f2');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Gestão de recepção, salas e locações do LUMIS." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="LUMIS | Centro Empresarial" />
    <meta property="og:description" content="Recepção e gestão em um só lugar." />
    <meta property="og:image" content="https://atrium-gestao-beta.ryanmaincamille.chatgpt.site/og.png" />
    <meta property="og:url" content="https://atrium-gestao-beta.ryanmaincamille.chatgpt.site/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LUMIS | Centro Empresarial" />
    <meta name="twitter:description" content="Recepção e gestão em um só lugar." />
    <meta name="twitter:image" content="https://atrium-gestao-beta.ryanmaincamille.chatgpt.site/og.png" />
    <title>LUMIS | Centro Empresarial</title>
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
